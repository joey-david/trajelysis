[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trajelysis"
version = "0.1.0"
description = "Generate, visualize, and analyze layer-wise latent trajectories in language-model reasoning."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
models = [
  "torch>=2.0",
  "transformers>=4.53,<6",
  "datasets>=2.19",
  "accelerate>=1.0",
  "safetensors>=0.4",
  "tqdm>=4.66",
]

[project.scripts]
trajelysis = "reasoning_trajectory.pipeline:main"
rt = "reasoning_trajectory.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["reasoning_trajectory*"]
