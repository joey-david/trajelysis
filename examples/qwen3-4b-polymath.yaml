name: qwen3-4b-polymath

model:
  name: Qwen/Qwen3-4B
  backend: hf
  device_map: auto
  dtype: bfloat16
  attn_implementation: sdpa
  trust_remote_code: false

dataset:
  source: hf
  path: Qwen/PolyMath
  name: en
  split: medium
  adapter: polymath_numeric
  require_gold_answer: true
  shuffle_seed: 42
  sample_limit: 3

generation:
  max_new_tokens: 1024
  num_samples_per_item: 3
  base_seed: 42
  temperature: 0.7
  top_p: 0.95
  top_k: 20

capture:
  enabled: true
  layers: [-1]
  activation_storage_dtype: float16
  diagnostics: false

prompt:
  mode: chat
  system: "You are a careful mathematical reasoner."
  instruction: |
    Think only as long as needed. Keep the reasoning clear and concise.
    Solve the problem and check the result.
    End with exactly: Answer: N
    Replace N with the final numeric answer.
  chat_template_kwargs:
    enable_thinking: true

analysis:
  produced_answer_regex: "(?i)(?:\\\\boxed\\{|(?:Final\\s+)?Answer\\s*:\\s*)(-?\\d+(?:\\.\\d+)?(?:[eE][+-]?\\d+)?)"
  gold_answer_regex: "(-?\\d+(?:\\.\\d+)?(?:[eE][+-]?\\d+)?)"
  think_end_token_id: 151668
  hard_question_limit: 20
